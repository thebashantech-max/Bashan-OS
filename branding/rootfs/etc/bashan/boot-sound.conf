# Bashan OS boot sound.
#
# ENABLED=no silences it but still holds the splash, so boot looks the same.
# To turn it off completely:   sudo systemctl disable bashan-boot-sound
#
# To use a different song, drop a WAV at /etc/bashan/boot-song.wav — that
# path wins over the shipped one and survives system updates. Convert with:
#   ffmpeg -i yoursong.mp3 -ar 48000 -ac 2 -c:a pcm_s16le /etc/bashan/boot-song.wav
ENABLED=yes
SONG=/usr/share/bashan/boot-song.wav

# Highest output level the startup song may play at, as a percentage. This
# only ever LOWERS the mixer: if it is already quieter, it is left alone.
# Blank it to leave the volume untouched entirely.
VOLUME=60
