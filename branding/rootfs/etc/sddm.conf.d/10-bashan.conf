# Bashan OS login screen settings.
[Theme]
# Stock Breeze, UNBRANDED, because every attempt to brand it stops people
# logging in. Tested on a real install:
#
#   our own theme          -> greeter exits, HELPER_DISPLAYSERVER_ERROR,
#                             no login screen at all
#   theme.conf.user        -> silently ignored; this SDDM has no ".user"
#                             string in the greeter binary, only
#                             "ConfigFile=theme.conf"
#   a copy of Breeze with
#   our wallpaper and logo -> greeter falls back to X11 and exits
#
# A login people can use comes before a branded one. The lock screen IS
# branded (see kscreenlockerrc), so the Bashan wallpaper is what someone
# sees whenever the machine locks - just not at first login.
Current=breeze

[General]
# ROOTFUL X. This was DisplayServer=wayland, and it left people looking at a
# black screen with no way in. Measured on the installed system 2026-10-20:
#
#   The Wayland greeter failed on EVERY boot - 100%, not intermittently -
#   with SDDM::Auth::HELPER_DISPLAYSERVER_ERROR. SDDM's compositor for the
#   greeter defaults to "weston --shell=fullscreen-shell.so", weston is not
#   installed, so there was never a compositor to start. Setting
#   CompositorCommand=kwin_wayland did not help; it still failed.
#
#   SDDM then fell back to DisplayServer=x11-user - rootless X running as
#   the sddm user - and THAT is the flaky part: about three boots in four
#   it died with
#       sddm-helper-start-x11user: Failed to read display number from pipe
#   the greeter exited, and SDDM did not retry. Black screen until reboot.
#
#   Two faults stacked: a Wayland greeter that never worked, hidden behind
#   an X fallback that usually did. The live session never showed it,
#   because it logs in automatically and starts no greeter at all.
#
# Rootful X is the plain old path: one display server, started as root, with
# no fallback to go wrong. The greeter comes up directly, no error logged.
DisplayServer=x11

# No on-screen keyboard. On real hardware the virtual keyboard covered the
# login screen on a laptop that has a perfectly good physical one.
InputMethod=

[Wayland]
# Set so that anyone who switches DisplayServer back to wayland gets a
# compositor that exists instead of SDDM's weston default. It is NOT enough
# on its own - the greeter still failed with it - but leaving the default
# pointing at a package we do not ship is a trap for whoever tries next.
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
