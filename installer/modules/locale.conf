# Bashan OS — timezone and locale chosen during install.
#
# The Location page lets the person pick; these are only the starting point
# if they click straight through.
#
# GeoIP is deliberately OFF. Debian's default asks geoip.kde.org where this
# machine is, which tells a third party the person's IP address before they
# have agreed to anything. On real hardware it also did not work: the
# install log showed "GeoIP returned invalid result" and it fell back to the
# default anyway, so the privacy cost bought nothing.
---
region: "America"
zone:   "Chicago"
