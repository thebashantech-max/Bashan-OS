# Bashan OS — post-install touches that have no Calamares module.
---
dontChroot: false
timeout: 60
script:
    # The live session's autologin must not follow the user onto their disk.
    - "-rm -f /etc/sddm.conf.d/zz-live-autologin.conf"
    # Make sure the Bashan look is the default for the account just created.
    - "-/bin/sh -c 'test -d /etc/skel/.config && cp -rn /etc/skel/.config/. /home/*/.config/ 2>/dev/null || true'"
    - "-/bin/sh -c 'chown -R $(ls /home | head -1):$(ls /home | head -1) /home/$(ls /home | head -1) 2>/dev/null || true'"
