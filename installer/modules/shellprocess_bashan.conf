# Bashan OS — post-install touches that have no Calamares module.
---
dontChroot: false
timeout: 60
script:
    # The live session's autologin must not follow the user onto their disk.
    - "-rm -f /etc/sddm.conf.d/zz-live-autologin.conf"
    # Seed the Bashan desktop defaults into the account Calamares created.
    # The username comes from Calamares itself, not from guessing at /home.
    # No @@USERNAME@@: that substitution never happened and the script got
    # the literal placeholder, which failed and aborted the install before
    # the bootloader was written. It finds the account itself now.
    - command: "/usr/libexec/bashan/bashan-seed-user"
      timeout: 30
    # The live session ships with the idle screen lock OFF, because an
    # install takes longer than the lock timeout and a locked screen
    # mid-install demands a password the user has not set yet. Turn it on
    # for the machine they will actually keep.
    - command: "/usr/libexec/bashan/bashan-enable-lock"
      timeout: 15
