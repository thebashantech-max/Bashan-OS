---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - scanner
    - users

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo

# No separate root password: the first user administers the machine with
# sudo, which is what Debian and Ubuntu both do and means one password to
# remember instead of two.
setRootPassword: false

doReusePassword: false

passwordRequirements:
    # Deliberately gentle. This is a family laptop, not a server: a rule
    # that forces symbols just produces a password on a sticky note.
    # Six characters still rules out the genuinely trivial ones.
    minLength: 6
    maxLength: -1

# A password is REQUIRED, and Calamares must not offer the "use it anyway"
# override. On real hardware a woken lock screen asked for a password that
# did not exist - a dead end, because no password can be typed and the
# stock lock screen offers no way to shut down either. The live session now
# never locks, and an installed system always has a password, so a lock
# screen is always answerable.
allowWeakPasswords: false
allowWeakPasswordsDefault: false

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "bashan-${cpu}"
    forbidden_names: [ localhost ]
