---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - scanner
    - users

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo

# No separate root password: the first user administers the machine with
# sudo, which is what Debian and Ubuntu both do and means one password to
# remember instead of two.
setRootPassword: false

doReusePassword: false

passwordRequirements:
    # Deliberately gentle. This is a family laptop, not a server: a rule
    # that forces symbols just produces a password on a sticky note.
    # Six characters still rules out the genuinely trivial ones.
    minLength: 6
    maxLength: -1

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "bashan-${cpu}"
    forbidden_names: [ localhost ]
