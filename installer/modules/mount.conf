# Bashan OS — what Calamares mounts into the target before it chroots.
#
# WHY THIS FILE EXISTS
#
# Without it the install log says:
#   WARNING: No config file for "mount" found anywhere
# and extraMounts is empty, so Calamares mounts the root filesystem and
# /boot/efi and nothing else. It then chroots in to run grub-install, which
# fails:
#
#   grub-install: error: cannot find a device for /boot/efi (is /dev mounted?)
#   ERROR: Installation failed: "Bootloader installation error"
#
# grub-install has to map /boot/efi back to a block device, and it cannot do
# that without /dev inside the chroot. The result is an installed system
# with a correct partition table, a full root filesystem and an EMPTY EFI
# partition, which does not boot. That is exactly what happened.
#
# This is the same class of fault as the build-time /dev/null problem in
# Stage 9: a chroot without real device nodes looks fine until something
# actually needs one.

---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    # The one that matters for grub-install.
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: devpts
      fs: devpts
      mountPoint: /dev/pts
    - device: tmpfs
      fs: tmpfs
      mountPoint: /dev/shm

# Where the EFI system partition is mounted inside the target. Must agree
# with efiSystemPartition in partition.conf and with the --efi-directory
# that bootloader.conf passes to grub-install.
efiMountPoint: /boot/efi
