# Bashan OS — /etc/fstab for the installed system.
#
# The values below are Calamares' own defaults, written out explicitly so
# that the EFI mount point agrees, in one visible place, with:
#   partition.conf   efiSystemPartition: /boot/efi
#   mount.conf       efiMountPoint:      /boot/efi
#   bootloader.conf  --efi-directory     /boot/efi
#
# A disagreement between those four is the kind of fault that produces a
# system which installs cleanly and then does not boot.
---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime,compress=zstd:1
    vfat: umask=0077

ssdExtraMountOptions:
    ext4: discard
    btrfs: discard=async
    xfs: discard

efiMountPoint: /boot/efi
