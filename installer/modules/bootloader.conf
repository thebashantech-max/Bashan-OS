# Bashan OS — boot loader installation, including Secure Boot.
---
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootloaderId: "Bashan"

# Secure Boot: Debian's grub-install installs the signed GRUB and the
# Microsoft-signed shim automatically when grub-efi-amd64-signed and
# shim-signed are present - and they are, from packages/base.list.chroot.
# Without that chain a Secure-Boot laptop refuses to start the installed
# system. See the Secure Boot section of docs/BUILD.md.
installEFIFallback: true

# Also install to the removable-media fallback path. Some firmware ignores
# NVRAM boot entries entirely; without this the disk boots on the test
# machine and not on the target.
forceGrubInstall: false
