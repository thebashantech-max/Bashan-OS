# Bashan OS — runs AFTER the bootloader job.
#
# Calamares' own installEFIFallback puts GRUB at
# \EFI\BOOT\BOOTX64.EFI, and Secure Boot refuses to run it: GRUB carries
# Debian's signature, which firmware does not trust. The removable path has
# to start at shim. Measured: the installed system failed to boot with
# "Access Denied" until this ran.
---
dontChroot: false
timeout: 180
script:
    - command: "/usr/libexec/bashan/bashan-fix-efi-fallback"
      timeout: 170
