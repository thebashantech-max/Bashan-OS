---
overwrite: false
# os-prober ON. The target machine dual-boots and GRUB must list the
# existing operating system. Binding, see docs/DESIGN.md.
defaults:
    GRUB_DISABLE_OS_PROBER: false
    GRUB_TIMEOUT: 5
    GRUB_DISTRIBUTOR: "Bashan OS"
    GRUB_THEME: "/boot/grub/themes/bashan/theme.txt"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash loglevel=3"
    GRUB_GFXPAYLOAD_LINUX: "keep"
