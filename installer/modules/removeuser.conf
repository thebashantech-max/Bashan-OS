# Bashan OS — delete the live session's account from the installed system.
#
# Without this file the module uses Calamares' default username, "live".
# Ours is not "live": scripts/10-lb-config.sh passes
# --bootappend-live "... username=$OS_ID ...", and OS_ID is "bashan".
#
# So with the default the module would look for an account that does not
# exist, find nothing, and leave the live "bashan" account sitting on the
# user's disk - a second, unexpected login account on every installed
# machine.
---
username: bashan
