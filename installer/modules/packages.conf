# Remove the installer itself from the finished system. Nobody wants an
# "Install Bashan OS" icon on a machine that is already installed.
---
backend: apt
update_db: false
update_system: false
operations:
  - remove:
      - calamares
      - qml6-module-qtquick-controls
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
