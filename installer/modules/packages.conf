# Remove the installer itself from the finished system. Nobody wants an
# "Install Bashan OS" icon on a machine that is already installed.
---
backend: apt
update_db: false
update_system: false
operations:
  # Only calamares itself. Do NOT add its QML dependencies here: apt remove
  # takes every reverse-dependency with it, and Plasma 6 depends on
  # qml6-module-qtquick-controls. Removing that one line uninstalled the
  # whole desktop -- the installed system booted to SDDM with an empty
  # session list and could not log in. Leaving the module installed costs
  # about a megabyte; Plasma needs it anyway.
  - remove:
      - calamares
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
