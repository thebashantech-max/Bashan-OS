---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
# Offer a second layout alongside the first for the RTL languages, so the
# user can always type Latin characters (passwords, URLs) as well as their
# own script. Toggle with both Alt keys.
guessLayout: true
