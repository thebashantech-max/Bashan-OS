# Bashan OS — runs AFTER the packages job.
#
# First removes the live-only configuration, then asserts the installed
# system is actually usable.
#
# /lib/live/config/2000-bashan-live is shipped by us, not by the live-config
# package, so removing live-config does NOT remove it. Nothing on an
# installed system would run it, but dead live-only config has no business
# on a person's machine.
#
# The verifier then checks that the packages job has not removed more than
# it named - it once took all of Plasma with it while still reporting
# success - and that no live-only setting survived into the install.
---
dontChroot: false
timeout: 60
script:
    - command: "/bin/rm -rf /lib/live"
      timeout: 15
    - command: "/usr/libexec/bashan/bashan-verify-install"
      timeout: 40
