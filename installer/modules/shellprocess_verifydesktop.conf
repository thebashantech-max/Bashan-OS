# Bashan OS — runs AFTER the packages job.
#
# The packages job can remove more than it names: apt takes every
# reverse-dependency with it. That silently uninstalled Plasma on install
# attempt 4 and produced a system with no session to log into, which the
# installer still reported as a success. This turns that into a failure.
---
dontChroot: false
timeout: 30
script:
    - command: "/usr/libexec/bashan/bashan-verify-install"
      timeout: 25
