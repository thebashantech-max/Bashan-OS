# Bashan OS — keep our boot splash on the installed system.
#
# Without this file the module runs with defaults and sets whatever theme
# it considers default, which would quietly replace the Bashan splash on
# the user's disk with a stock one. The live image has Theme=bashan in
# plymouthd.conf; this makes the install agree.
#
# Theme name verified against the target, not assumed:
#   plymouth-set-default-theme  ->  bashan
---
plymouth_theme: bashan
