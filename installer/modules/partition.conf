# Bashan OS — disk setup. SAFETY-CRITICAL. See docs/DESIGN.md.
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: "EFI"

# THE IMPORTANT LINE.
# "none" means no option is selected when the page opens. The user has to
# deliberately choose. Any other value here would pre-select something, and
# "erase" pre-selected is exactly how people wipe a disk by pressing Next.
initialPartitioningChoice: none
initialSwapChoice:         none

userSwapChoices:
  - none
  - small
  - suspend
  - file

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
# Manual partitioning stays available for anyone who wants it, but every
# ordinary choice - including install alongside an existing system - is a
# plain radio button on the main page, not hidden behind it.
allowManualPartitioning:   true

defaultFileSystemType:   "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# Refuse to run on a disk too small to hold the result.
requiredStorage: 20

# Leave existing partitions alone unless explicitly told otherwise.
enableLuksAutomatedPartitioning: true
