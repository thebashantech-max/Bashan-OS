# Bashan OS — first screen. Deliberately plain: a language list and nothing
# that needs explaining.
---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    # 20 GB is comfortable for the full desktop plus room to work.
    requiredStorage:  20
    requiredRam:      1.8
    internetCheckUrl: http://deb.debian.org/debian/
    check:
      - storage
      - ram
      - power
      - internet
      - root
      - screen
    # Only these three actually block installing. Running on battery or with
    # no network is a warning, not a refusal: the ISO carries everything it
    # needs, including firmware, so an offline install works fine.
    required:
      - storage
      - ram
      - root
