# Bashan OS installer. Publisher: Bashan Tech LLC.
#
# Safety rules below are binding, from docs/DESIGN.md:
#   * no disk is touched until the user has seen a summary naming the drive
#   * dual boot is a visible first-class choice, not an expert-mode option
#   * the destructive choice is never pre-selected
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id:     bashan
  module: shellprocess
  config: shellprocess_bashan.conf

sequence:
# --- what the user sees, in order ---------------------------------------
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary        # the confirmation screen: names the drive and the changes
# --- what actually happens, only after they confirm ----------------------
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@bashan
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - removeuser
  - umount
- show:
  - finished

branding: bashan

# A final "are you sure" dialog before anything is written to the disk.
# This is on top of the summary page, deliberately: two confirmations.
prompt-install: true

# Install onto the target, do not treat the running system as the target.
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
