# Bashan OS — desktop responsiveness tuning. Publisher: Bashan Tech LLC.
# Every value here is documented in docs/BUILD.md in plain words.

# --- Memory, tuned for zram rather than a disk swap file ---------------
# Compressed RAM swap is cheap, so reclaim early and often instead of
# stalling under memory pressure.
vm.swappiness = 180
# zram has no seek cost, so reading extra pages around a fault is waste.
vm.page-cluster = 0
# Keep more directory/inode cache; it is the hot path for file managers.
vm.vfs_cache_pressure = 50

# --- Write-back, tuned to stop multi-second stalls on big copies -------
# Absolute byte limits beat percentages: on a 32 GB machine the default
# ratios let gigabytes of dirty pages pile up, then flush all at once.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728

# --- Limits that modern desktop and game workloads hit -----------------
vm.max_map_count = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- Latency ------------------------------------------------------------
# The NMI watchdog costs a timer interrupt per CPU and only helps debug
# kernel hangs, which an end-user desktop cannot act on anyway.
kernel.nmi_watchdog = 0

# --- Network ------------------------------------------------------------
# fq_codel kills bufferbloat: a large upload stops ruining video calls.
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr
