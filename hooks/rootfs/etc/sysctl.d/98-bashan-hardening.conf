# Bashan OS — kernel hardening that is safe on a desktop.
#
# Separate from 99-bashan-performance.conf on purpose: that file is about
# speed, this one is about safety, and they should be arguable separately.
#
# DELIBERATELY NOT SET, and why:
#   kernel.unprivileged_userns_clone = 0
#     would break the sandboxes in Brave and Chrome, and break Flatpak.
#     A browser without its sandbox is far more dangerous than user
#     namespaces are.
#   kernel.yama.ptrace_scope = 3
#     would stop debuggers and crash handlers working at all, permanently,
#     until reboot. Scope 1 below gives most of the benefit.
#   kernel.kexec_load_disabled = 1
#     would break hibernation resume paths on some laptops.
#   net.ipv4.ip_forward = 0 is already the default; setting it would fight
#     with the VPN tooling in Part F.

# --- information leaks --------------------------------------------------
# Kernel pointers in /proc are a gift to local exploit code.
kernel.kptr_restrict = 1
# Keep the kernel log for root. It leaks addresses and hardware detail.
kernel.dmesg_restrict = 1

# --- process isolation ---------------------------------------------------
# A process may only be traced by its own parent. Stops one compromised
# program reading another's memory - a browser reading a password manager.
# Scope 1 is what Ubuntu has shipped for years; debuggers still work when
# started as the parent, which is how people use them.
kernel.yama.ptrace_scope = 1

# --- filesystem ----------------------------------------------------------
# The classic /tmp symlink and hardlink races.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- network -------------------------------------------------------------
# Drop packets claiming to come from an address we would not route back to.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# A laptop is not a router and must not be redirected by one.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Source routing lets a sender choose the return path. Nothing legitimate
# needs it.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
# Survive a SYN flood rather than stop answering.
net.ipv4.tcp_syncookies = 1
# Do not answer broadcast pings; it makes the machine a reflector.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Log packets with impossible source addresses.
net.ipv4.conf.all.log_martians = 1
