# Bashan OS — compressed swap in RAM.
# Half of physical RAM, capped at 8 GB, compressed with zstd. On a 4 GB
# machine this yields ~2 GB of zram holding roughly 4-6 GB of real pages.
# Priority 100 keeps it ahead of any on-disk swap partition.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
