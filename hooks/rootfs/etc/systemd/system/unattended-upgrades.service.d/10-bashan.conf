# Bashan OS — bound how long an update may hold a shutdown.
#
# Debian ships TimeoutStopSec=1800, so a security update landing at the
# wrong moment can keep a laptop on, lid closed, in a bag, for half an hour
# showing "please don't turn off the computer". On real hardware this
# screen appeared at shutdown and the machine then powered itself off.
#
# Two minutes is enough for the small security updates we allow
# (Origins-Pattern is Debian-Security only, with MinimalSteps on, so work is
# committed in small steps and an interrupted run resumes cleanly next time
# via AutoFixInterruptedDpkg).
[Service]
TimeoutStopSec=120
