# Bashan OS — Converseen defaults.
#
# Measured: the shipped binary contains https://converseen.fasterland.net/update/
# and https://fasterland.net/software-updates/converseen-version.txt and has a
# "check for updates" control (widget keys DialogShowUpdateMsg /
# checkCheckUpdates, QSettings org "Faster").
#
# shortcut: these two key names were read out of the binary, not confirmed by
# running Converseen and inspecting the file it writes. If a startup version
# check still happens, read ~/.config/Faster/Converseen.conf after first run
# and correct the key names here.
[General]
checkCheckUpdates=false
DialogShowUpdateMsg=false
