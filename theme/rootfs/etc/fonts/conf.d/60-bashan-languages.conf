<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Bashan OS — per-language font preferences.

  Done in fontconfig rather than per-user settings on purpose: this is the
  mechanism that actually works across Qt, GTK, the browser and LibreOffice
  at once, it needs no login script, and it keeps working when the user
  switches language.

  Every family name below was read out of the font packages with fc-query,
  not guessed. (The SIL family in trixie is "Scheherazade", not
  "Scheherazade New".) Unknown families are ignored by fontconfig, so the
  Noto entries fall through harmlessly if a Noto package is ever dropped. -->
<fontconfig>

  <!-- Arabic -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans Arabic</string><string>Scheherazade</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Amiri</string><string>Scheherazade</string>
    </edit>
  </match>

  <!-- Persian: Nazli is the standard body face; Noto reads better in UI -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans Arabic</string><string>Nazli</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Nazli</string><string>Scheherazade</string>
    </edit>
  </match>

  <!-- Sorani Kurdish: Arabic script, and Lateef was designed for it -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ckb</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans Arabic</string><string>Lateef</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ckb</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Lateef</string><string>Scheherazade</string>
    </edit>
  </match>

  <!-- Hebrew -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans Hebrew</string><string>Nachlieli CLM</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Frank Ruehl CLM</string><string>David CLM</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Miriam Mono CLM</string>
    </edit>
  </match>

  <!-- Syriac. Estrangelo Edessa is the most widely used digital Syriac
       face; a native reader should confirm whether Serto or East Syriac
       suits this audience better. Flagged in docs/I18N.md. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>syr</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Estrangelo Edessa</string><string>Serto Jerusalem</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>syr</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Estrangelo Edessa</string><string>East Syriac Adiabene</string>
    </edit>
  </match>

  <!-- Kurmanji is written in Latin script, so it needs no special family,
       only the Turkish dotted/dotless i, which Noto and DejaVu both have. -->

</fontconfig>
