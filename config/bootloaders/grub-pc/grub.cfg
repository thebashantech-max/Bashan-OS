source /boot/grub/config.cfg

# Someone booting an old machine from a cheap stick has no way to know
# that the second entry exists for exactly that case. Say it on screen.
set timeout=15

# Live boot
@LINUX_LIVE@

# Copies the whole image into memory before starting, then runs with the USB
# stick no longer in the path. Everything after boot is as fast as RAM,
# which matters most on an old machine booting from a slow stick: the live
# session reads programs out of a COMPRESSED filesystem, so every first
# launch pays for USB speed plus decompression.
#
# It needs enough RAM to hold the image (about 3 GB) plus room to work, so
# it is NOT the default - on a 4 GB machine it would fail where the normal
# entry works. The first entry stays selected.
menuentry "Live system (load to RAM - faster)" --hotkey=r {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ toram
    initrd @INITRD_LIVE@
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux @KERNEL_LIVE@ @APPEND_LIVE@ custom options here
# initrd @INITRD_LIVE@
# }
# menuentry "Alternate graphical installer" {
# linux @KERNEL_GI@ @APPEND_GI@ custom options here
# initrd @INITRD_GI@
# }
# menuentry "Alternate textual installer" {
# linux @KERNEL_DI@ @APPEND_DI@ custom options here
# initrd @INITRD_DI@
# }

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
