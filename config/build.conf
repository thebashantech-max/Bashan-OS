# Bashan OS build configuration. Shell-sourced; keep it plain key=value.
#
# The release-related settings take an environment override, so a public
# build can be made without editing this file and leaving it edited:
#
#   PUBLIC_RELEASE=yes INCLUDE_BOOT_SONG=no PLACEHOLDER_ASSETS=yes \
#   ISO_NAME=Bashan-OS-1.0-amd64-public.hybrid.iso ./build.sh config
#
# The defaults below are the PRIVATE test build.

OS_NAME="Bashan OS"
OS_ID="bashan"
OS_VERSION="1.0"
OS_CODENAME="Bashan"
OS_PUBLISHER="Bashan Tech LLC"
OS_HOME_URL="https://bashan.app"

ARCH="amd64"
SUITE="trixie"
MIRROR="https://deb.debian.org/debian"
ISO_NAME="${ISO_NAME:-Bashan-OS-1.0-amd64.hybrid.iso}"

# Container used for all build work (Approach B).
CONTAINER_IMAGE="docker.io/library/debian:trixie-slim"
CONTAINER_NAME="bashan-build"

# Boot splash hold, seconds. Song is 4.911 s.
SPLASH_HOLD="5.5"

# Trash icon artwork: A keeps the Arabic text etched in the glass,
# B has it removed. Both are generated; this picks which one ships.
TRASH_VARIANT="B"

# Boot song. RIGHTS ARE UNCONFIRMED: the song may be used in private test
# builds only. Setting PUBLIC_RELEASE=yes while the song is included makes
# the build refuse to run, so it cannot leave by accident.
INCLUDE_BOOT_SONG="${INCLUDE_BOOT_SONG:-yes}"
PUBLIC_RELEASE="${PUBLIC_RELEASE:-no}"

# Swap every image whose origin is unconfirmed - the hand logo, the Trash
# artwork and the mountain photograph - for a plain generated mark and a
# plain gradient. See LICENSE section 2b for the list and why it exists.
# The ridge wallpaper is kept either way: it is drawn from code and is ours.
# A public release should have this on until the owner confirms the rights.
PLACEHOLDER_ASSETS="${PLACEHOLDER_ASSETS:-no}"
